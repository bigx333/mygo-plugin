name: host

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/host/go.mod
      - run: go vet ./...
        working-directory: examples/host
      - run: go test ./...
        working-directory: examples/host
      - run: go build ./...
        working-directory: examples/host
